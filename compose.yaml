name: jobfinderkz
services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobfinder
      POSTGRES_USER: jobfinder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-jobfinder-password}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U jobfinder -d jobfinder]
      interval: 5s
      retries: 20
  migrate:
    build: ./backend
    env_file: .env
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://jobfinder:${POSTGRES_PASSWORD:-local-jobfinder-password}@db/jobfinder
      STORAGE_PATH: /storage
    command: [alembic, upgrade, head]
    depends_on:
      db: {condition: service_healthy}
  api:
    build: ./backend
    env_file: .env
    environment: *backend-env
    volumes:
      - storage:/storage
    ports: [127.0.0.1:8000:8000]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      retries: 10
  worker:
    build: ./backend
    env_file: .env
    environment: *backend-env
    command: [python, -m, app.worker]
    volumes:
      - storage:/storage
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  web:
    build: ./frontend
    ports: [127.0.0.1:5173:80]
    depends_on: [api]
    restart: unless-stopped
volumes:
  postgres:
  storage:
